name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_SITE_URL: https://example.com
      NUXT_SUPABASE_URL: https://project-ref.supabase.co
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Initial JS budget
        run: node scripts/perf/initial-js.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: output-${{ github.sha }}
          path: .output
          include-hidden-files: true
          retention-days: 7
